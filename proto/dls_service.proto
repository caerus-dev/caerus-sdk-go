syntax = "proto3";

package caerus.dls.v1;

import "google/protobuf/empty.proto";

option java_multiple_files = true;
option java_package = "dev.caerus.proto.dls";
option java_outer_classname = "DistributedLockingEngineProto";

// The Distributed Locking Engine service provides the hot path execution
// for acquiring, renewing, and releasing distributed locks based on
// configured lock templates.
service DistributedLockingEngine {
  // Begins a transaction and returns a unique transaction_id.
  rpc BeginTransaction(BeginTransactionRequest) returns (BeginTransactionResponse);

  // Acquires a distributed lock.
  rpc AcquireLock(AcquireLockRequest) returns (stream AcquireLockResponse);

  // Renews an active transaction to extend its time-to-live.
  rpc RenewTransaction(RenewTransactionRequest) returns (RenewTransactionResponse);

  // Releases a lock so others can acquire it.
  rpc ReleaseLock(ReleaseLockRequest) returns (google.protobuf.Empty);

  // Releases all locks held or requested by a specific transaction.
  rpc ReleaseTransactionLocks(ReleaseTransactionLocksRequest) returns (google.protobuf.Empty);

  // Gets the current status of a lock.
  rpc GetLockStatus(GetLockStatusRequest) returns (GetLockStatusResponse);

  // Gets the current status of a transaction and its associated locks.
  rpc GetTransactionStatus(GetTransactionStatusRequest) returns (GetTransactionStatusResponse);
}

// Request to begin a transaction
message BeginTransactionRequest {
  optional int64 timeout_ms = 1;
}

// Response containing the newly generated transaction ID.
message BeginTransactionResponse {
  string transaction_id = 1;
}

// Request to release all locks owned by a specific transaction.
message ReleaseTransactionLocksRequest {
  string transaction_id = 1;
}

// Represents the mode of the lock.
enum LockMode {
  MODE_UNSPECIFIED = 0;
  
  // Exclusive lock (only one holder allowed). Used for Writers or purely Exclusive templates.
  EXCLUSIVE = 1;
  
  // Shared lock (multiple holders allowed). Used for Readers.
  SHARED_READ = 2;
}

// Request to acquire a distributed lock.
message AcquireLockRequest {
  // The namespace corresponds to the DistributedLockTemplate name.
  string namespace = 1;
  
  // The dynamic resource key being locked.
  string lock_key = 2;
  
  // Optional idempotency key to prevent duplicate acquisitions.
  optional string idempotency_key = 3;
  
  
  // Specifies if the client wants to Read or Write. 
  // Required if the namespace template is configured as READ_WRITE.
  optional LockMode requested_mode = 5; 

  // The correlation transaction_id returned by BeginTransaction.
  string transaction_id = 6;
}

// Represents the acquisition status of a lock.
enum LockStatus {
  // The lock status is unknown or unspecified.
  LOCK_STATUS_UNSPECIFIED = 0;
  
  // The lock was successfully acquired.
  ACQUIRED = 1;
  
  // The lock was denied (e.g., already held by another process).
  DENIED = 2;
  
  // The lock request has been queued (queued mode).
  QUEUED = 3;
}

// Response from an acquire lock request.
// Note on Server Streaming: The server will send a first QUEUED event if the lock cannot be acquired immediately. 
// It will then send multiple QUEUED events periodically (keep-alive) to prevent idle timeouts during long waits.
// Finally, it will send a single terminal ACQUIRED or DENIED event before closing the stream.
message AcquireLockResponse {
  // The unique identifier for the acquired lock.
  string lock_id = 1;
  
  // Monotonically increasing fencing token (generated by ZooKeeper's czxid).
  // Useful for preventing split-brain scenarios in downstream storage.
  int64 fencing_token = 2;
  
  // The status of the lock acquisition.
  LockStatus status = 3;
}

// Request to renew an existing transaction.
message RenewTransactionRequest {
  // The unique identifier for the transaction to renew.
  string transaction_id = 1;
  
  // The extra milliseconds to add to the transaction's maximum lifetime.
  int64 extra_ms = 2;
}

// Response from a renew transaction request.
message RenewTransactionResponse {
  // The unique identifier of the renewed transaction.
  string transaction_id = 1;
  
  // The new absolute maximum lifetime in epoch milliseconds.
  int64 new_expires_at = 2;
}

// Request to release a held lock.
message ReleaseLockRequest {
  // The unique identifier of the lock to release.
  string lock_id = 1;

  // The correlation transaction_id returned by BeginTransaction.
  string transaction_id = 2;
}

// Request to get the current status of a specific lock.
message GetLockStatusRequest {
  // The namespace corresponding to the DistributedLockTemplate.
  string namespace = 1;
  
  // The dynamic resource key.
  string lock_key = 2;
}

// Information about a specific process holding the lock.
message LockHolderInfo {
  string lock_id = 1;
  int64 expires_at = 2;
  int64 fencing_token = 3;
}

// Response containing the status of a queried lock.
message GetLockStatusResponse {
  // Indicates if the lock is currently held by ANY process.
  bool is_held = 1;
  
  // If held, indicates if it's currently locked for EXCLUSIVE (write) or SHARED_READ.
  LockMode current_mode = 2;
  
  // List of active holders. If EXCLUSIVE, this will have at most 1 item.
  // If SHARED_READ, it can contain multiple items.
  repeated LockHolderInfo active_holders = 3;
  
  // Observability: How many processes are currently queued/waiting for this lock.
  int32 pending_queue_size = 4;
}

// Request to get the current status of a specific transaction.
message GetTransactionStatusRequest {
  // The transaction ID.
  string transaction_id = 1;
}

// Information about a lock requested or held by a transaction.
message TransactionLockInfo {
  string namespace = 1;
  string lock_key = 2;
  LockMode requested_mode = 3;
  LockStatus status = 4;
}

// Response containing the status of a queried transaction.
message GetTransactionStatusResponse {
  // The current status of the transaction (e.g. ACTIVE, ABORT_REQUESTED, ABORTED)
  string status = 1;
  
  // If aborted, the reason for the abort.
  string abort_reason = 2;
  
  // Locks currently requested or held by this transaction.
  repeated TransactionLockInfo locks = 3;

  // Absolute maximum lifetime of the transaction in epoch milliseconds.
  int64 expires_at = 4;
}

