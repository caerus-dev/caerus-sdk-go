name: Tests

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

concurrency:
  group: tests-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

env:
  PROTOC_VERSION: '36.0'
  PROTOC_GEN_GO_VERSION: v1.36.12
  PROTOC_GEN_GO_GRPC_VERSION: v1.6.2
  STATICCHECK_VERSION: v0.8.1
  GOVULNCHECK_VERSION: v1.8.0

jobs:
  test:
    name: Go ${{ matrix.go }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        go: ['1.26.x', '1.27.x']

    steps:
      - name: Traer el codigo
        uses: actions/checkout@v4

      - name: Preparar Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}

      - name: Revisar el formato
        run: test -z "$(gofmt -l .)"

      - name: Revisar el codigo
        run: go vet ./...

      - name: Correr los tests con el detector de carreras
        run: go test -race -count=1 ./...

  lint:
    name: staticcheck y govulncheck
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Traer el codigo
        uses: actions/checkout@v4

      - name: Preparar Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'

      - name: staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@${STATICCHECK_VERSION} ./...

      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION} ./...

  generated:
    name: Codigo generado al dia
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Traer el codigo
        uses: actions/checkout@v4

      - name: Preparar Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'

      - name: Instalar protoc y los plugins
        run: |
          curl -sSL -o protoc.zip "https://github.com/protocolbuffers/protobuf/releases/download/v${PROTOC_VERSION}/protoc-${PROTOC_VERSION}-linux-x86_64.zip"
          sudo unzip -q -o protoc.zip -d /usr/local
          rm protoc.zip
          go install google.golang.org/protobuf/cmd/protoc-gen-go@${PROTOC_GEN_GO_VERSION}
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@${PROTOC_GEN_GO_GRPC_VERSION}

      - name: Regenerar y comparar con lo commiteado
        run: |
          go generate ./internal/proto/
          git diff --exit-code -- internal/proto
